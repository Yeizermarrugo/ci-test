name: CI - Análisis de código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests + cobertura mínima 80% (Jest)
        run: npm test
